random_seed: 42

paths:
  raw_data: data/raw/H2.csv
  processed_dir: data/processed
  artifacts_dir: artifacts
  figures_dir: outputs/figures
  tables_dir: outputs/tables

split:
  # Train / validation / test; the test set is used once, for final evaluation only.
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15
  cv_folds: 5

# Fill each feature list after deciding the prediction point and leakage audit.
regression:
  target: ADR
  # Provisional booking-creation inputs; see reports/knn_baseline_notes.md.
  features:
    - LeadTime
    - ArrivalDateYear
    - ArrivalDateMonth
    - ArrivalDateDayOfMonth
    - StaysInWeekendNights
    - StaysInWeekNights
    - Adults
    - Children
    - Babies
    - Meal
    - MarketSegment
    - DistributionChannel
    - ReservedRoomType
  categorical_features:
    - ArrivalDateMonth
    - Meal
    - MarketSegment
    - DistributionChannel
    - ReservedRoomType
  knn:
    n_neighbors: 5
    weights: uniform
    p: 2

classification:
  target: IsCanceled
  stratify: true
  features: []
  # Inputs come from the shared src/preprocessing/booking.py classification policy.
  decision_tree:
    # Untuned Milestone 1 baseline: these are the scikit-learn defaults (seed: random_seed).
    criterion: gini
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: null

clustering:
  features: []
  agglomerative:
    # Descriptive booking attributes; outcome columns are rejected. ADR is a descriptive input here,
    # but it is computed from lodging transactions, so it is not a verified booking-time value.
    features: [LeadTime, StaysInWeekendNights, StaysInWeekNights, Adults, ADR]
    # Summarised per cluster for interpretation only (never used for fitting or selection).
    profile_columns: [Children, MarketSegment, CustomerType, DepositType, Meal, IsRepeatedGuest,
                      TotalOfSpecialRequests]
    sample_size: 8000       # seeded random sample; full hierarchical clustering needs O(n^2) memory
    dendrogram_leaves: 30
    # Milestone 1 untuned baseline (the default command).
    baseline: {n_clusters: 3, linkage: ward, metric: euclidean}
    # Optional, not part of the Milestone 1 baseline: --search and --stability.
    search:
      n_clusters: [2, 3, 4, 5, 6, 7, 8, 9, 10]
      linkage: [ward, complete, average, single]
      metric: [euclidean, manhattan, cosine]   # Ward only supports Euclidean; other pairs are skipped
      min_cluster_fraction: 0.02               # reject configurations with a cluster under 2% of the sample
    stability_runs: 10
